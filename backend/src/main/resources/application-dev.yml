spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    out-of-order: true

logging:
  level:
    com.alms: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

jwt:
  secret: dev-secret-key-not-for-production-use-min-32-chars
  refresh-secret: dev-refresh-secret-not-for-production-min-32x
