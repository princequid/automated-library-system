spring:
  application:
    name: alms-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alms}
    username: ${DB_USER:alms}
    password: ${DB_PASSWORD:alms}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    whitelabel:
      enabled: false

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:change-me-in-production-min-32-chars}
  refresh-secret: ${JWT_REFRESH_SECRET:change-me-refresh-min-32-chars-xx}
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 7

oidc:
  issuer-url: ${OIDC_ISSUER_URL:https://login.microsoftonline.com/tenant/v2.0}
  client-id: ${OIDC_CLIENT_ID:}
  client-secret: ${OIDC_CLIENT_SECRET:}
  redirect-uri: ${OIDC_REDIRECT_URI:}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:alms-assets}

cors:
  allowed-origins:
    - ${ADMIN_APP_URL:http://localhost:3000}
    - ${EXPO_DEV_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
